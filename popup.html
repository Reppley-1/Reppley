<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Discord 접속</title>
    <!-- Font Awesome CDN 링크를 추가하여 외부 아이콘을 불러옵니다. -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        /* 팝업 창의 기본 스타일을 설정합니다. */
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-width: 250px; /* 팝업의 최소 너비를 지정합니다. */
        }

        /* 버튼을 감싸는 컨테이너 스타일 */
        .container {
            padding: 20px;
            text-align: center;
        }

        /* 디스코드 버튼 스타일 */
        .discord-btn {
            background-color: #5865F2;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: background-color 0.2s ease-in-out;
            width: 100%;
            box-sizing: border-box;
        }

        /* 마우스를 올렸을 때의 스타일 */
        .discord-btn:hover {
            background-color: #4752C4;
        }
        
        /* Font Awesome 아이콘 스타일 */
        .discord-btn .fab.fa-discord {
            font-size: 22px; /* 아이콘 크기 조정 */
            margin-right: 10px; /* 아이콘과 텍스트 사이의 간격 */
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 새 탭에서 디스코드 링크를 엽니다. -->
        <a href="https://discord.gg/qgYCu27wJa" target="_blank" rel="noopener noreferrer" class="discord-btn">
            <!-- Font Awesome의 디스코드 아이콘을 사용합니다. -->
            <i class="fab fa-discord"></i>
            <span>Discord 접속</span>
        </a>
    </div>

</body>
</html>
